[project]
name = "oneinfo-backend"
version = "0.1.0"
description = "OneInfo AI Video Creator backend (FastAPI + Postgres/pgvector)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.17",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "celery>=5.4",
  "redis>=5.2",
  "httpx>=0.27",
  "google-auth>=2.35",
  "requests>=2.32",
  "google-cloud-storage>=2.18",
  "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# B008: FastAPI's idiomatic Depends()/File() in argument defaults, not a bug.
# BLE001: intentional broad catches in background job/health-check paths,
# so one bad chunk/provider failure can't crash the process.
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["celery.*", "google.cloud.*"]
ignore_missing_imports = true
